name: Bizidea CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # Frontend CI
  frontend-ci:
    name: Frontend - Lint, Test & Build
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Run tests
      run: npm test -- --coverage --watchAll=false

    - name: Build application
      run: npm run build

  # Backend CI
  backend-ci:
    name: Backend - Lint, Test & Build
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip'
        cache-dependency-path: './backend/requirements.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run linting
      run: |
        pip install flake8 black
        flake8 .
        black --check .

    - name: Run tests
      run: |
        pip install pytest pytest-cov
        pytest --cov=app --cov-report=xml

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: backend

  # Security Scan
  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run security scan
      uses: actions/dependency-review-action@v3

  # Deploy to Staging (on push to dev)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci, security-scan]
    if: github.ref == 'refs/heads/dev'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy Frontend to Vercel (Staging)
      run: echo "Deploying frontend to Vercel staging..."
      # Vercel deployment would be configured here

    - name: Deploy Backend to Heroku (Staging)
      run: echo "Deploying backend to Heroku staging..."
      # Heroku deployment would be configured here

  # Deploy to Production (on push to main)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci, security-scan]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy Frontend to Vercel (Production)
      run: echo "Deploying frontend to Vercel production..."
      # Vercel deployment would be configured here

    - name: Deploy Backend to Heroku (Production)
      run: echo "Deploying backend to Heroku production..."
      # Heroku deployment would be configured here
